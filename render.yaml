services:
  - type: web
    name: homeserve-backend-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: HomeServe API
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        value: homeserve-enterprise-super-secret-jwt-key-2026-production-ready
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_HomeServeKey123
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_HomeServeSecret456
      - key: RAZORPAY_WEBHOOK_SECRET
        value: whsec_HomeServeWebhook789
      - key: CLOUDINARY_CLOUD_NAME
        value: demo-homeserve
      - key: CLOUDINARY_API_KEY
        value: "1234567890"
      - key: CLOUDINARY_API_SECRET
        value: cloudinary_secret_demo
      - key: PLATFORM_COMMISSION_PERCENT
        value: "15.0"
      - key: TAX_PERCENT
        value: "18.0"
      - key: CORS_ORIGINS
        value: "https://home-serve-app.vercel.app,http://localhost:5173"
